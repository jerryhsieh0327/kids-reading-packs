<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>風信谷・溪邊棧道樣板樣張（尚未上架遊戲）</title>
  <style>
    body { font-family: "PingFang TC", "Noto Sans TC", sans-serif; margin: 0 auto; max-width: 920px; padding: 24px 16px 48px; color: #2b2418; background: #f4efe6; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { line-height: 1.55; }
    figure { margin: 28px 0; }
    img { width: 100%; height: auto; border-radius: 12px; background: #ddd; display: block; }
    figcaption { margin-top: 8px; color: #5a5146; }
    .note { background: #fff; border-radius: 12px; padding: 14px 16px; }
  </style>
</head>
<body>
  <h1>溪邊棧道單關樣板樣張</h1>
  <p class="note">這是給審看用的靜態樣張，不是可玩遊戲，也不會取代現有的風信谷 v2。角色工作室轉台與實際遊戲畫面都在下面。</p>
  <figure>
    <img src="lili-studio_front.jpg" alt="栗栗工作室正面轉台">
    <figcaption>栗栗工作室正面：可見芥黃帽、護目鏡、背心與噴壺。</figcaption>
  </figure>
  <figure>
    <img src="dongdong-studio_qtr-right.jpg" alt="咚咚工作室四分之三轉台">
    <figcaption>咚咚工作室四分之三：可見棕色幾維鳥身形、橙色圍巾與提燈。</figcaption>
  </figure>
  <figure>
    <img src="game-start.jpg" alt="遊戲開始畫面：棧道被木箱擋住">
    <figcaption>遊戲開始畫面：棧道被第一隻木箱擋住，可見出口方向與操作提示。</figcaption>
  </figure>
  <figure>
    <img src="game-walk.jpg" alt="遊戲內鏡頭下的栗栗與咚咚">
    <figcaption>遊戲內鏡頭：這是實際遊玩時較接近的角色樣子。</figcaption>
  </figure>
  <figure>
    <img src="level-puzzle.jpg" alt="第二段側向置箱灣與放這邊標記">
    <figcaption>第二段側向置箱灣，地上有「放這邊」標記。</figcaption>
  </figure>
</body>
</html>
